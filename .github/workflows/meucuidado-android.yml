name: MeuCuidado Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meucuidado/**'
      - 'mobile/**'
      - '.github/workflows/meucuidado-android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build instalavel para Android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runner already includes Android SDK; setup-android v3 tries to install deprecated 'tools'.
      - name: Android SDK availability
        run: | 
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Vendor realistic Rocketbox avatar into APK
        shell: bash
        run: |
          mkdir -p mobile/www/models
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 25 --max-time 240 'https://raw.githubusercontent.com/memoriesrohit/avatar-studio/2fd9ec82fbe1613d40ae38aadcca3f410725f740/models/ethan_casual.glb' -o mobile/www/models/avatar.glb
          python3 -c "from pathlib import Path; p=Path('mobile/www/models/avatar.glb'); assert p.stat().st_size>1000000 and p.read_bytes()[:4]==b'glTF'; print('GLB verified',p.stat().st_size)"
      - name: Prepare Android project
        working-directory: mobile
        run: npm run build:android
      - name: Apply MeuCuidado app icon
        shell: bash
        run: |
          for icon in mobile/android/app/src/main/res/mipmap-*/ic_launcher.png mobile/android/app/src/main/res/mipmap-*/ic_launcher_round.png mobile/android/app/src/main/res/mipmap-*/ic_launcher_foreground.png; do
            if [ -f "$icon" ]; then cp meucuidado/icon-512.png "$icon"; fi
          done
      - name: Build Android APK (debug-signed)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Output APK
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/dist/Mapa-do-Corpo-v4.0.apk
          test -s mobile/dist/Mapa-do-Corpo-v4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mapa-do-Corpo-v4.0-Android
          path: mobile/dist/Mapa-do-Corpo-v4.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='mapa-do-corpo-v4.0'
          file='mobile/dist/Mapa-do-Corpo-v4.0.apk'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --title 'MeuCuidado 4.0 — Android APK' --notes 'Android APK instalável, assinado com chave de depuração. Avatar 3D Microsoft Rocketbox incluído no aplicativo. Objetivos e checklists guardados no aparelho.'
          fi
