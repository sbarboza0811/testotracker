  }

  const sc={high:'Juros elevados: compare custo de oportunidade, liquidez e risco de crédito da renda fixa.',fall:'Juros em queda: avalie sensibilidade a marcação a mercado e duração dos títulos.',infl:'Inflação persistente: compare retornos reais e proteção de poder de compra.',fx:'Câmbio volátil: revise exposição efetiva ao exterior e tolerância a oscilações em reais.'};
  items.push({level:'blue',title:'Cenário econômico selecionado',text:sc[S.scenario]||sc.high,why:'Hipótese educativa. Não há dados econômicos ao vivo nem recomendação de compra automática.'});

function renderModal(){let t=ui.modal.t,rec=ui.modal.id?S.records.find(x=>x.id===ui.modal.id):null;const sample=rec?.v|| (t==='trade'?[dbr(new Date().toISOString().slice(0,10)),'Compra','Mercado à Vista','-','','',1,0,0]:['Credito',dbr(new Date().toISOString().slice(0,10)),'Dividendo','','',1,0,0]);const fields=header(t),selects=t==='trade'?{1:['Compra','Venda'],2:['Mercado à Vista','Mercado Fracionário','Outros']}:{0:['Credito','Debito'],2:['Dividendo','Juros Sobre Capital Próprio','Rendimento','Transferência','Transferência - Liquidação','Bonificação em Ativos','Direito de Subscrição','Compra','Venda','Outro']};

async function importExcel(files){let count=0,dups=0,invalid=0,details=[];const known=new Set(S.records.map(r=>fingerprint(r.t,r.v)));
  for(const f of Array.from(files)){if(!/\.xlsx$/i.test(f.name)){details.push(f.name+': extensão incompatível, selecione XLSX.');continue;}
    try{const sheets=await Excel.read(f);let accepted=0,skip=0,bad=0,recognized=false;
      for(const sheet of sheets){let rows=sheet.rows;let headIndex=-1,kind='';for(let i=0;i<Math.min(8,rows.length);i++){const k=norm(rows[i].join('|'));if(norm(rows[i][0])===norm(NHEAD[0])&&norm(rows[i][5])===norm(NHEAD[5])){kind='trade';headIndex=i;break;}if(norm(rows[i][0])===norm(MHEAD[0])&&norm(rows[i][2])===norm(MHEAD[2])){kind='mov';headIndex=i;break;}}
        if(headIndex<0)continue;recognized=true;
        for(const r of rows.slice(headIndex+1)){if(!r||!r.some(v=>txt(v)))continue;const v=canon(kind,r);if(!validRow(kind,v)){bad++;continue;}const key=fingerprint(kind,v);if(known.has(key)){skip++;continue;}known.add(key);S.records.push({t:kind,v,id:'i'+uid(),source:f.name});accepted++;}
      }
      if(!recognized)throw Error('Cabeçalhos não correspondem aos modelos B3 de Negociação ou Movimentação.');
      S.sources[f.name]={accepted,skipped:skip,type:f.name.toLowerCase().includes('movimentacao')?'mov':'trade'};
      count+=accepted;dups+=skip;invalid+=bad;details.push(`${f.name}: ${accepted} novos, ${skip} duplicados, ${bad} inválidos.`);
    }catch(e){details.push(`${f.name}: ERRO — ${e.message}`);}
  }
  save();ui.report=`Resultado da importação: ${count} novos registros, ${dups} duplicados ignorados, ${invalid} inválidos.\n`+details.join('\n');page='files';ui.kind='trade';render();toast(`${count} novos, ${dups} repetidos bloqueados.`,count===0&&dups===0);
}
function download(blob,name){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportSheet(t){const rows=groupRecords(t).slice().sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).map(r=>r.v);const title=t==='trade'?'Negociação':'Movimentação',file=t==='trade'?'negociacao':'movimentacao';const blob=Excel.create(title,[header(t),...rows]);download(blob,`${file}-moneytracker-${new Date().toISOString().slice(0,10)}.xlsx`);toast(`Exportados ${rows.length} registros de ${title} no formato B3.`);}
function addManual(e){e.preventDefault();const form=e.target,t=ui.modal.t,record=ui.modal.id?S.records.find(r=>r.id===ui.modal.id):null;const data=new FormData(form);let row=header(t).map((_,i)=>data.get('f'+i));const dt=t==='trade'?0:1;row[dt]=dbr(row[dt]);row=canon(t,row);if(!validRow(t,row)){toast('Preencha data, ativo/produto, instituição e os campos obrigatórios.',true);return;}
  const key=fingerprint(t,row),found=S.records.find(r=>r.id!==record?.id&&fingerprint(r.t,r.v)===key);if(found){toast('Registro duplicado: já existe uma linha com os mesmos dados. Nada foi inserido.',true);return;}
  if(record){record.v=row;record.source='Editado no aplicativo';}else S.records.push({t,v:row,id:'m'+uid(),source:'Lançamento manual'});
  save();ui.modal=null;$('.modal-bg')?.remove();page='records';ui.kind=t;render();toast(record?'Registro atualizado.':'Registro manual adicionado.');}
function backup(){download(new Blob([JSON.stringify({format:'moneytracker-backup',date:new Date().toISOString(),data:S},null,2)],{type:'application/json'}),'moneytracker-backup-'+new Date().toISOString().slice(0,10)+'.json');}
async function restoreBackup(file){try{const obj=JSON.parse(await file.text());if(obj.format!=='moneytracker-backup'||obj.data?.v!==3||!Array.isArray(obj.data.records))throw Error('Backup não reconhecido.');
    const records=[],seen=new Set();for(const r of obj.data.records){if(!['trade','mov'].includes(r.t))continue;const v=canon(r.t,r.v);if(!validRow(r.t,v))continue;const f=fingerprint(r.t,v);if(seen.has(f))continue;seen.add(f);records.push({...r,v,id:String(r.id||uid())});}
    if(!confirm(`Substituir seus ${S.records.length} registros pelos ${records.length} do backup? Faça um backup antes, se necessário.`))return;
    S={...original(),...obj.data,records,targets:{...TARGET,...obj.data.targets},goal:{...DEFAULT_GOAL,...obj.data.goal}};save();page='home';render();toast('Backup restaurado, sem registros repetidos.');}catch(e){toast('Falha ao restaurar backup: '+e.message,true);}}
function dispatch(e){const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;ui.search='';ui.pageLimit=80;window.scrollTo(0,0);render();return;}
  const kind=e.target.closest('[data-kind]');if(kind){ui.kind=kind.dataset.kind;ui.search='';ui.pageLimit=80;render();return;}
  const sc=e.target.closest('[data-scenario]');if(sc){S.scenario=sc.dataset.scenario;save();render();return;}
  const edit=e.target.closest('[data-edit]');if(edit){const r=S.records.find(x=>x.id===edit.dataset.edit);if(r){ui.modal={t:r.t,id:r.id};renderModal();}return;}
  const del=e.target.closest('[data-delete]');if(del){const r=S.records.find(x=>x.id===del.dataset.delete);if(r&&confirm('Excluir definitivamente este registro?')){S.records=S.records.filter(x=>x.id!==r.id);save();render();toast('Registro excluído.');}return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='open-import'){$('#file-input').click();return;}if(act==='add-trade'||act==='add-mov'){ui.modal={t:act==='add-mov'?'mov':'trade'};renderModal();return;}
  if(act==='close-modal'){ui.modal=null;$('.modal-bg')?.remove();return;}
  if(act==='show-more'){ui.pageLimit+=80;render();return;}
  if(act==='export-trade'||act==='export-mov'){exportSheet(act==='export-trade'?'trade':'mov');return;}
  if(act==='backup'){backup();return;}if(act==='import-backup'){$('#backup-input').click();return;}
  if(act==='clear'){if(confirm('Apagar todos os registros do MoneyTracker neste navegador? Esta ação não pode ser desfeita sem backup.')&&confirm('Confirma que deseja excluir TODOS os seus registros?')){S.records=[];S.sources={};save();render();toast('Base esvaziada.');}return;}
}
document.addEventListener('click',dispatch);
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){addManual(e);return;}
  if(e.target.id==='target-form'){e.preventDefault();const d=new FormData(e.target),t={};for(const c of CATS)t[c.id]=Number(d.get(c.id)||0);const tot=Object.values(t).reduce((a,b)=>a+b,0);if(Math.abs(tot-100)>.01){toast('A distribuição precisa somar exatamente 100%. Soma atual: '+nfmt(tot,1)+'%.',true);return;}S.targets=t;save();render();toast('Distribuição-alvo atualizada.');return;}
  if(e.target.id==='goal-form'){e.preventDefault();const d=new FormData(e.target);S.goal={name:txt(d.get('name')),amount:Number(d.get('amount')),months:Number(d.get('months')),monthly:Number(d.get('monthly')),profile:txt(d.get('profile'))};save();render();toast('Objetivo atualizado.');return;}
});
document.addEventListener('change',e=>{if(e.target.matches('#pf')){ui.portfolioFilter=e.target.value;render();}if(e.target.matches('[data-class]')){S.classes[e.target.dataset.class]=e.target.value;save();render();toast('Classificação do ativo ajustada.');}});
document.addEventListener('input',e=>{if(e.target.matches('#search')){const val=e.target.value,sel=e.target.selectionStart;ui.search=val;render();const field=$('#search');field?.focus();field?.setSelectionRange(sel,sel);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;$('.modal-bg')?.remove();}});
$('#file-input').addEventListener('change',async e=>{if(e.target.files.length)await importExcel(e.target.files);e.target.value='';});
$('#backup-input').addEventListener('change',async e=>{if(e.target.files.length)await restoreBackup(e.target.files[0]);e.target.value='';});
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();$('#drop-zone')?.classList.add('drag');}});
document.addEventListener('dragleave',e=>{$('#drop-zone')?.classList.remove('drag');});
document.addEventListener('drop',async e=>{if(e.dataTransfer?.files?.length){e.preventDefault();$('#drop-zone')?.classList.remove('drag');await importExcel(e.dataTransfer.files);}});
render();
window.MoneyCloud.start({load(data){S=(data&&data.v===3&&Array.isArray(data.records))?{...original(),...data,records:data.records,targets:{...TARGET,...data.targets},goal:{...DEFAULT_GOAL,...data.goal}}:original();page='home';render();window.MoneyCloud.updateBadge();},logout(){S=original();page='home';render();}});
window.__MONEYTRACKER_TEST__={Excel,S,activity,fingerprint,canon,validRow,importExcel,exportSheet,render,go:(p)=>{page=p;render();}};
})();
</script></body></html>
