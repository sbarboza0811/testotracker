<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="description" content="TestoTrack 3.0 — sua rotina de alimentação, musculação e saúde em um só lugar">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TestoTrack">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="stylesheet" href="./v3.css"><title>TestoTrack — Meu dia</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script defer src="./v3-data.js"></script><script defer src="./v3-cloud.js"></script><script defer src="./v3-ui.js"></script>
</head><body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo" aria-hidden="true">T<span>+</span></div><div><strong>TestoTrack</strong><small>SEU PROGRESSO, TODO DIA</small></div></div><div class="top-right"><span id="sync-badge" class="sync-badge" title="Estado da sincronização">Local</span><button class="iconbtn" data-go="ajustes" aria-label="Ajustes">⚙</button></div></header>
<main id="app" tabindex="-1"><section class="panel"><h1>Carregando sua rotina…</h1><p>Seus dados continuam salvos neste dispositivo.</p></section></main>
</div>
<button id="fab" class="fab" aria-label="Adicionar registro" title="Adicionar registro">+</button>
<nav class="bottom-nav" aria-label="Navegação principal"><button data-go="hoje" class="active"><span>⌂</span>Hoje</button><button data-go="diario"><span>▤</span>Diário</button><button data-go="treinar"><span>⚑</span>Treinar</button><button data-go="evolucao"><span>↗</span>Evolução</button></nav>
